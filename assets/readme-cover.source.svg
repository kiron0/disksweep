<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Swipr — storage clarity for your AI agent</title>
  <desc id="description">A dark teal cover using Unbounded and Onest: Less guesswork. More clarity. Audit your storage. Review every change.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101D25"/>
      <stop offset="1" stop-color="#0A131A"/>
    </linearGradient>
    <linearGradient id="accent" x1="843" y1="65" x2="1048" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A1F4D4"/>
      <stop offset="1" stop-color="#38BAA8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#D0EEE5" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#background)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="19.5" stroke="#7DDABF" stroke-opacity=".15"/>
  <rect x="680" y="1" width="500" height="318" fill="url(#grid)"/>
  <g font-family="Onest">
    <circle cx="62" cy="53" r="4" fill="#89E7C8"/>
    <text x="78" y="58" fill="#A5BDBE" font-size="13" font-weight="600" letter-spacing="2.5">SWIPR / LOCAL STORAGE</text>
    <text x="56" y="134" fill="#F0F7F5" font-family="Unbounded" font-size="48" font-weight="600" letter-spacing="-1.2">Less guesswork.</text>
    <text x="56" y="194" fill="#91EDCF" font-family="Unbounded" font-size="48" font-weight="600" letter-spacing="-1.2">More clarity.</text>
    <text x="59" y="259" fill="#B7C9CB" font-size="18">Audit your storage. Review every change.</text>
  </g>
  <circle cx="947" cy="151" r="120" stroke="#7DDABF" stroke-opacity=".09"/>
  <circle cx="947" cy="151" r="91" stroke="#223A40" stroke-width="24"/>
  <circle cx="947" cy="151" r="91" stroke="url(#accent)" stroke-width="24" stroke-linecap="round" stroke-dasharray="391 572" transform="rotate(-90 947 151)"/>
  <circle cx="947" cy="151" r="52" stroke="#A4BFC0" stroke-opacity=".2"/>
  <path d="M926 151H968M947 130V172" stroke="#DCF7EE" stroke-width="3" stroke-linecap="round"/>
  <rect x="794" y="254" width="306" height="34" rx="17" fill="#14282D" stroke="#30524F"/>
  <text x="947" y="276" text-anchor="middle" fill="#B8DED1" font-family="Onest" font-size="12" font-weight="600" letter-spacing="1.3">AUDIT  /  EXPLAIN  /  REVIEW</text>
</svg>
