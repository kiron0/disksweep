name: Security policy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      # AST policy restricts unlink to the guarded POSIX removal handle; no shell execution.
      - run: python scripts/check_project.py --strict
      - run: python -m unittest discover -s tests -p test_engine.py -v
      - run: python -m unittest discover -s tests -p test_features.py -v
      - run: python -m unittest discover -s tests -p test_remove.py -v
