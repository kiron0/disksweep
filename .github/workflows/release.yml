name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag to publish or retry
        required: true
        type: string
        default: v0.1.2
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  publish:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      SWIPR_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SWIPR_RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the release version
        run: |
          python - <<'PY'
          import os, re, sys
          sys.path.insert(0, 'scripts')
          from _core import VERSION
          tag = os.environ['SWIPR_RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'A stable version tag is required'
          assert tag == 'v' + VERSION, 'Tag and skill version must match'
          PY
      - name: Build the skill and checksum
        run: |
          python scripts/package_skill.py "dist/swipr-${SWIPR_RELEASE_TAG}.skill"
          cd dist
          sha256sum "swipr-${SWIPR_RELEASE_TAG}.skill" > SHA256SUMS
      - name: Prepare release notes
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ['SWIPR_RELEASE_TAG']
          sections = Path('CHANGELOG.md').read_text().split('\n## ')
          section = next(s for s in sections if s.startswith(tag[1:] + ' — '))
          changes = section.split('\n', 1)[1].strip()
          assert changes, 'The release requires changelog entries'
          notes = Path('.github/release-notes.md').read_text().replace('{{TAG}}', tag).replace('{{CHANGES}}', changes)
          Path('dist/release-notes.md').write_text(notes)
          PY
      - name: Publish the stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$SWIPR_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$SWIPR_RELEASE_TAG" "dist/swipr-${SWIPR_RELEASE_TAG}.skill" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$SWIPR_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$SWIPR_RELEASE_TAG" --notes-file dist/release-notes.md --draft=false --prerelease=false --latest
          else
            gh release create "$SWIPR_RELEASE_TAG" "dist/swipr-${SWIPR_RELEASE_TAG}.skill" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$SWIPR_RELEASE_TAG" --notes-file dist/release-notes.md --verify-tag --latest
          fi
