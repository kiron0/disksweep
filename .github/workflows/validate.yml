name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  skill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_project.py --strict
      - run: python scripts/package_skill.py dist/swipr.skill
      - uses: actions/upload-artifact@v4
        with:
          name: swipr-skill
          path: dist/swipr.skill
